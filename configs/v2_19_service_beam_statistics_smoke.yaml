scenario:
  channel_model: numpy_geometric_uma
  min_ue_distance_m: 35.0
  max_ue_distance_m: 120.0
  num_clusters: 2
  delay_spread_ns: 50.0
  shadow_fading_std_db: 2.0

topology:
  layout: one_site_three_sector
  num_sites: 1
  sectors_per_site: 1
  sector_azimuths_deg: [0.0]
  sector_width_deg: 120.0

system:
  run_mode: service_beam_statistics
  num_drops: 1
  random_seed: 20260610
  tx_power_dbm: 33.0
  subcarrier_spacing_khz: 30.0

pdsch:
  num_prbs: 24

ue_drop:
  num_ut_per_sector: 4
  distribution: uniform_in_sector

trp:
  num_trps_per_sector: 1
  num_panels_per_sector: 1

rf_architecture:
  txru_connectivity: fully_connected
  allow_independent_polarization_beams: false
  num_txru: 1
  max_parallel_beams_per_trp: auto

tx_array:
  model: tr38901_panel
  num_ae: 16
  M: 4
  N: 4
  P: 1
  Mg: 1
  Ng: 1
  Mp: 1
  Np: 1
  num_txru: 1
  beam_scope: joint
  num_beams_h: 2
  num_beams_v: 2
  max_beams: 4

ue_array:
  model: tr38901_panel
  num_ae: 4
  M: 2
  N: 2
  P: 1
  Mg: 1
  Ng: 1
  Mp: 1
  Np: 1
  num_rxru: 1
  beam_scope: joint
  num_beams_h: 2
  num_beams_v: 2
  max_beams: 4

measurement:
  num_freq_points: 3
  gamma_backend: numpy
  gamma_ue_batch_size: 0

service_beam_statistics:
  observations_per_drop: 20
  warmup_observations: 2
  observation_interval_ms: 100.0
  include_zero_count: true
  save_per_ue_arrival_samples: true
  traffic:
    model: 3gpp_ftp_model_3_arrival_only
    arrival_rate_per_ue_s: 0.2
    file_size_mbytes: 0.5

progress:
  enabled: false

sionna:
  enable_import_probe: false
